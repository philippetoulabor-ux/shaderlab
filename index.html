<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shader Lab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="panel">
      <h1>Shader Lab</h1>
      <div class="controls">
        <label for="shaderSelect">Shader</label>
        <select id="shaderSelect"></select>

        <div id="customShaderPanel" aria-hidden="true">
          <label for="customMainImage">mainImage (GLSL ES 3.00)</label>
          <textarea id="customMainImage" spellcheck="false" rows="14"></textarea>
          <div id="channelInputs" class="channel-inputs">
            <label for="channel0Url">iChannel0 URL</label>
            <input type="url" id="channel0Url" placeholder="https://…" autocomplete="off" />
            <label for="channel1Url">iChannel1 URL</label>
            <input type="url" id="channel1Url" placeholder="https://…" autocomplete="off" />
            <label for="channel2Url">iChannel2 URL</label>
            <input type="url" id="channel2Url" placeholder="https://…" autocomplete="off" />
            <label for="channel3Url">iChannel3 URL</label>
            <input type="url" id="channel3Url" placeholder="https://…" autocomplete="off" />
          </div>
          <pre id="shaderCompileError" hidden></pre>
        </div>

        <div id="uniformControls"></div>

        <div class="buttons">
          <button id="randomizeBtn">Randomize</button>
          <div class="exportDropdown">
            <button id="exportBtn" aria-haspopup="menu" aria-expanded="false">Export</button>
            <div id="exportMenu" class="exportMenu" role="menu" aria-label="Export menu" hidden>
              <button type="button" class="exportMenuItem" role="menuitem" data-export-action="copyShaderCode">Shader-Code kopieren</button>
              <button type="button" class="exportMenuItem" role="menuitem" data-export-action="exportVideo">Video exportieren</button>
            </div>
          </div>
        </div>

        <details>
          <summary>Info</summary>
          <p id="shaderDesc"></p>
        </details>
      </div>
    </aside>

    <main id="canvasWrap">
      <!-- Three.js canvas will be appended here -->
    </main>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
